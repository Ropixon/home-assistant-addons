name: Ropixon LoRa Gateway
version: "0.9.6"
slug: ropixon_gateway
image: "ghcr.io/ropixon/{arch}-addon-ropixon_gateway"
description: Experimental LoRa USB gateway with MQTT Discovery
arch:
  - aarch64
  - amd64
startup: application
boot: auto
uart: true
backup: cold
stage: experimental
map:
  - addon_config:rw    # /config: the gateway state, kept when the app is uninstalled
ingress: true
ingress_port: 8099
panel_icon: mdi:access-point-network
panel_title: RopixNet
options:
  serial_port: auto
  region: EU868
  baud: 230400
  max_sensors: 256
  pairing_rssi_filter: true
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  sensor_stale_seconds: 0
  start_as_new_gateway: false
schema:
  serial_port: str
  region: list(EU868)
  frequency: int(150000000,960000000)? # legacy bootstrap; the saved network is authoritative
  baud: int(9600,1000000)
  sf: int(7,12)? # legacy bootstrap; the saved network is authoritative
  bw: int(7,500)? # legacy bootstrap; the saved network is authoritative
  cr: int(45,48)? # legacy bootstrap; the saved network is authoritative
  power: int(0,22)? # legacy bootstrap; the saved network is authoritative
  delivery: list(hard|soft)? # legacy bootstrap; the saved network is authoritative
  max_sensors: int(1,256)
  pairing_rssi_filter: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_tls: bool
  sensor_stale_seconds: int(0,604800)
  start_as_new_gateway: bool
